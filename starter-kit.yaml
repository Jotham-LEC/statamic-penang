export_paths:
  - app/Support
  - app/Theme
  - app/Providers/PenangServiceProvider.php
  - bootstrap/app.php
  - config/penang.php
  - config/marketing-toolkit.php
  - config/statamic/cp.php
  - config/statamic/search.php
  - content
  - resources/blueprints
  - resources/fieldsets
  - resources/forms
  - resources/sites.yaml
  - lang/ms.json
  - lang/zh_CN.json
  - resources/views
  - resources/css
  - resources/js
  - resources/fonts
  - resources/icons
  - package.json
  - package-lock.json
  - vite.config.js
  - public/build
  - public/assets
  - resources/asset-meta
  - docs
  - NOTICE.md
dependencies:
  jotham-lec/statamic-marketing-toolkit: 0.27.0
modules:
  ai:
    prompt: "Add Laravel Boost, with Penang's and the Marketing Toolkit's guidelines, skills and tools for AI coding agents?"
    export_paths:
      - app/Boost
      - resources/ai
    dependencies_dev:
      laravel/boost: ^2.10
