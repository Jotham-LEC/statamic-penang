title: 'Page builder'
fields:
  -
    handle: blocks
    field:
      type: replicator
      display: Sections
      instructions: 'The page, from top to bottom. Add sections, drag them into order, and switch one off to hide it.'
      collapse: accordion
      previews: true
      button_label: 'Add a section'
      sets:
        sections:
          display: Sections
          sets:
            hero:
              display: Hero
              instructions: 'A big opening: heading, text, buttons and a picture.'
              image: hero.jpg
              fields:
                -
                  handle: layout
                  field:
                    type: button_group
                    display: Layout
                    options:
                      centred: Centred
                      split: 'Text beside a picture'
                      background: 'Text on a photo'
                    default: split
                -
                  handle: image_position
                  field:
                    type: button_group
                    display: 'Picture on the'
                    options:
                      left: Left
                      right: Right
                    default: right
                    if:
                      layout: 'equals split'
                -
                  handle: eyebrow
                  field:
                    type: text
                    display: Eyebrow
                    character_limit: 40
                    width: 33
                -
                  handle: heading
                  field:
                    type: text
                    display: Heading
                    character_limit: 90
                    width: 66
                    validate:
                      - required
                -
                  handle: text
                  field:
                    type: bard
                    display: Text
                    buttons:
                      - bold
                      - italic
                      - anchor
                    inline: true
                    inline_hard_breaks: true
                    save_html: false
                    toolbar_mode: floating
                    reading_time: false
                    remove_empty_nodes: trailing
                    character_limit: 280
                -
                  import: buttons
                -
                  handle: from_price
                  field:
                    type: toggle
                    display: 'Show the lowest price'
                    instructions: 'A line under the buttons: "From RM 268", the lowest price among your products.'
                    default: false
                -
                  handle: image
                  field:
                    type: assets
                    display: Picture
                    container: assets
                    folder: images
                    max_files: 1
                    mode: grid
                    instructions: 'Landscape, at least 1600 pixels wide. Centred heroes show it below the text.'
                -
                  handle: video
                  field:
                    type: assets
                    display: 'Background video'
                    instructions: 'A short, silent MP4 loop (under 10 MB) played behind the text. The picture shows until it plays, and instead of it for visitors who turn off motion.'
                    container: assets
                    folder: videos
                    max_files: 1
                    validate:
                      - nullable
                      - 'mimetypes:video/mp4,video/webm'
                    if:
                      layout: 'equals background'
                -
                  import: section_options
            text:
              display: Text
              instructions: 'Paragraphs, headings, lists and tables.'
              image: text.jpg
              fields:
                -
                  handle: eyebrow
                  field:
                    type: text
                    display: Eyebrow
                    instructions: 'A few words above the heading. Optional.'
                    character_limit: 40
                    width: 33
                -
                  handle: heading
                  field:
                    type: text
                    display: Heading
                    character_limit: 90
                    width: 66
                -
                  handle: intro
                  field:
                    type: bard
                    display: Introduction
                    buttons:
                      - bold
                      - italic
                      - anchor
                    inline: true
                    inline_hard_breaks: true
                    save_html: false
                    toolbar_mode: floating
                    reading_time: false
                    remove_empty_nodes: trailing
                    character_limit: 280
                -
                  handle: content
                  field:
                    type: bard
                    display: Text
                    buttons:
                      - h2
                      - h3
                      - bold
                      - italic
                      - unorderedlist
                      - orderedlist
                      - quote
                      - anchor
                      - table
                    save_html: false
                    toolbar_mode: fixed
                    reading_time: false
                    remove_empty_nodes: trailing
                -
                  handle: alignment
                  field:
                    type: button_group
                    display: Alignment
                    options:
                      left: Left
                      centre: Centred
                    default: left
                    width: 50
                -
                  import: section_options
            image_text:
              display: 'Picture and text'
              instructions: 'A picture (or a few) beside a heading, text and a button.'
              image: image-text.jpg
              fields:
                -
                  handle: image
                  field:
                    type: assets
                    display: Picture
                    container: assets
                    folder: images
                    max_files: 1
                    mode: grid
                    validate:
                      - required
                -
                  handle: image_position
                  field:
                    type: button_group
                    display: 'Picture on the'
                    options:
                      left: Left
                      right: Right
                    default: left
                    width: 50
                -
                  handle: image_shape
                  field:
                    type: button_group
                    display: 'Picture shape'
                    options:
                      landscape: Landscape
                      square: Square
                      portrait: Portrait
                    default: landscape
                    width: 50
                -
                  handle: more_images
                  field:
                    type: assets
                    display: 'More pictures'
                    instructions: 'Up to three more, shown with the first. Each picture’s caption is the one in its details (Assets).'
                    container: assets
                    folder: images
                    max_files: 3
                    mode: grid
                    width: 50
                -
                  handle: pictures_layout
                  field:
                    type: button_group
                    display: 'Several pictures as'
                    options:
                      collage: 'A collage'
                      stacked: 'A column'
                    default: collage
                    width: 50
                -
                  handle: eyebrow
                  field:
                    type: text
                    display: Eyebrow
                    character_limit: 40
                    width: 33
                -
                  handle: heading
                  field:
                    type: text
                    display: Heading
                    character_limit: 90
                    width: 66
                -
                  handle: content
                  field:
                    type: bard
                    display: Text
                    buttons:
                      - h2
                      - h3
                      - bold
                      - italic
                      - unorderedlist
                      - orderedlist
                      - quote
                      - anchor
                    save_html: false
                    toolbar_mode: fixed
                    reading_time: false
                    remove_empty_nodes: trailing
                -
                  import: buttons
                -
                  import: section_options
            gallery:
              display: Gallery
              instructions: 'A grid of pictures that open larger when clicked.'
              image: gallery.jpg
              fields:
                -
                  handle: eyebrow
                  field:
                    type: text
                    display: Eyebrow
                    instructions: 'A few words above the heading. Optional.'
                    character_limit: 40
                    width: 33
                -
                  handle: heading
                  field:
                    type: text
                    display: Heading
                    character_limit: 90
                    width: 66
                -
                  handle: intro
                  field:
                    type: bard
                    display: Introduction
                    buttons:
                      - bold
                      - italic
                      - anchor
                    inline: true
                    inline_hard_breaks: true
                    save_html: false
                    toolbar_mode: floating
                    reading_time: false
                    remove_empty_nodes: trailing
                    character_limit: 280
                -
                  handle: layout
                  field:
                    type: button_group
                    display: Layout
                    options:
                      grid: 'Even grid'
                      masonry: 'Masonry (each picture its own shape)'
                    default: grid
                    width: 50
                -
                  handle: columns
                  field:
                    type: button_group
                    display: Columns
                    options:
                      2: '2'
                      3: '3'
                      4: '4'
                    default: '3'
                    width: 50
                -
                  handle: images
                  field:
                    type: assets
                    display: Pictures
                    instructions: 'Each picture’s caption and alt text are the ones in its details (Assets).'
                    container: assets
                    folder: images
                    mode: grid
                    validate:
                      - required
                -
                  handle: captions
                  field:
                    type: toggle
                    display: 'Show captions'
                    default: true
                    width: 50
                -
                  handle: lightbox
                  field:
                    type: toggle
                    display: 'Open larger when clicked'
                    default: true
                    width: 50
                -
                  import: section_options
            video:
              display: Video
              instructions: 'A YouTube or Vimeo video, or your own, that loads only when played.'
              image: video.jpg
              fields:
                -
                  handle: eyebrow
                  field:
                    type: text
                    display: Eyebrow
                    instructions: 'A few words above the heading. Optional.'
                    character_limit: 40
                    width: 33
                -
                  handle: heading
                  field:
                    type: text
                    display: Heading
                    character_limit: 90
                    width: 66
                -
                  handle: intro
                  field:
                    type: bard
                    display: Introduction
                    buttons:
                      - bold
                      - italic
                      - anchor
                    inline: true
                    inline_hard_breaks: true
                    save_html: false
                    toolbar_mode: floating
                    reading_time: false
                    remove_empty_nodes: trailing
                    character_limit: 280
                -
                  handle: source
                  field:
                    type: button_group
                    display: 'Video from'
                    options:
                      youtube: YouTube
                      vimeo: Vimeo
                      file: 'An uploaded file'
                    default: youtube
                    width: 50
                -
                  handle: url
                  field:
                    type: text
                    display: Address
                    instructions: 'The video’s address, copied from your browser or the Share button.'
                    width: 50
                    unless:
                      source: 'equals file'
                -
                  handle: file
                  field:
                    type: assets
                    display: 'Video file'
                    instructions: MP4.
                    container: assets
                    folder: videos
                    max_files: 1
                    width: 50
                    if:
                      source: 'equals file'
                -
                  handle: title
                  field:
                    type: text
                    display: 'What it shows'
                    instructions: 'For people who can’t see it, and for the play button.'
                    validate:
                      - required
                    character_limit: 100
                -
                  handle: poster
                  field:
                    type: assets
                    display: 'Cover picture'
                    container: assets
                    folder: images
                    max_files: 1
                    mode: grid
                    instructions: 'Shown until the video is played. Without one, a plain panel with a play button. (YouTube’s and Vimeo’s own covers would load from their sites before the visitor asks.)'
                -
                  handle: layout
                  field:
                    type: button_group
                    display: Layout
                    options:
                      wide: Wide
                      split: 'Beside text'
                    default: wide
                    width: 50
                -
                  handle: video_position
                  field:
                    type: button_group
                    display: 'Video on the'
                    options:
                      left: Left
                      right: Right
                    default: right
                    width: 50
                    if:
                      layout: 'equals split'
                -
                  handle: content
                  field:
                    type: bard
                    display: Text
                    buttons:
                      - h2
                      - h3
                      - bold
                      - italic
                      - unorderedlist
                      - orderedlist
                      - quote
                      - anchor
                    save_html: false
                    toolbar_mode: fixed
                    reading_time: false
                    remove_empty_nodes: trailing
                    if:
                      layout: 'equals split'
                -
                  import: buttons
                -
                  import: section_options
            feature_grid:
              display: Features
              instructions: 'What you offer or why choose you, as a grid of short points.'
              image: feature-grid.jpg
              fields:
                -
                  handle: eyebrow
                  field:
                    type: text
                    display: Eyebrow
                    instructions: 'A few words above the heading. Optional.'
                    character_limit: 40
                    width: 33
                -
                  handle: heading
                  field:
                    type: text
                    display: Heading
                    character_limit: 90
                    width: 66
                -
                  handle: intro
                  field:
                    type: bard
                    display: Introduction
                    buttons:
                      - bold
                      - italic
                      - anchor
                    inline: true
                    inline_hard_breaks: true
                    save_html: false
                    toolbar_mode: floating
                    reading_time: false
                    remove_empty_nodes: trailing
                    character_limit: 280
                -
                  handle: layout
                  field:
                    type: button_group
                    display: Layout
                    options:
                      grid: Icons
                      cards: Cards
                      offset: 'Heading beside the list'
                    default: grid
                    width: 50
                -
                  handle: columns
                  field:
                    type: button_group
                    display: Columns
                    options:
                      2: '2'
                      3: '3'
                      4: '4'
                    default: '3'
                    width: 50
                    unless:
                      layout: 'equals offset'
                -
                  handle: items
                  field:
                    type: grid
                    display: Points
                    mode: stacked
                    min_rows: 1
                    add_row: 'Add a point'
                    fields:
