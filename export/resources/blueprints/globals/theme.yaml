title: Theme
tabs:
  main:
    display: Theme
    sections:
      -
        display: Look
        instructions: 'Each preset is a whole look: fonts, corners and colours chosen to go together. See every section in it at [/components](/components). A preset for your own brand is added by your developer (app/Theme/Options.php).'
        fields:
          -
            handle: preset
            field:
              type: select
              display: Preset
              options:
                default: Default
                kopitiam: 'Kopitiam (warm)'
                pantai: 'Pantai (sea)'
                hutan: 'Hutan (forest)'
                batik: 'Batik (indigo and soga brown)'
              default: default
              validate:
                - required
      -
        display: 'Light and dark'
        fields:
          -
            handle: mode
            field:
              type: button_group
              display: 'Show the site in'
              options:
                system: 'Follow the visitor’s device'
                light: Light
                dark: Dark
              default: system
          -
            handle: mode_toggle
            field:
              type: toggle
              display: 'Let visitors switch'
              instructions: 'A sun and moon button in the header.'
              default: true
