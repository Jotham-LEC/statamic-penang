title: Page
tabs:
  main:
    display: Page
    sections:
      -
        fields:
          -
            handle: title
            field:
              type: text
              display: Title
              validate:
                - required
          -
            import: page_builder
  sidebar:
    display: Sidebar
    sections:
      -
        fields:
          -
            handle: slug
            field:
              type: slug
              display: Slug
              localizable: true
              validate:
                - 'max:200'
          -
            handle: parent
            field:
              type: entries
              display: Parent
              collections:
                - pages
              max_items: 1
              listable: false
              localizable: true
          -
            handle: template
            field:
              type: select
              display: 'Kind of page'
              instructions: 'What the page shows after its sections.'
              options:
                legal: 'Legal page: its Text sections with a table of contents'
                products/index: 'Every product'
                articles/index: 'Every blog article'
                search: 'Search results'
                showcase: 'The components page'
              clearable: true
              placeholder: 'A page of sections'
  seo:
    display: SEO
    sections:
      -
        fields:
          -
            import: 'marketing-toolkit::seo'
