title: Product
tabs:
  main:
    display: Product
    sections:
      -
        fields:
          -
            handle: title
            field:
              type: text
              display: Name
              validate:
                - required
          -
            handle: summary
            field:
              type: textarea
              display: Summary
              instructions: 'One or two sentences for the product cards.'
              character_limit: 200
          -
            handle: images
            field:
              type: assets
              display: Pictures
              instructions: 'The first is the main one. Square or landscape.'
              container: assets
              folder: images
              mode: grid
          -
            handle: content
            field:
              type: bard
              display: Description
              buttons:
                - h2
                - h3
                - bold
                - italic
                - unorderedlist
                - orderedlist
                - quote
                - anchor
              save_html: false
              toolbar_mode: fixed
              reading_time: false
              remove_empty_nodes: trailing
      -
        display: Details
        instructions: 'A list under the description: what’s inside, sizes, materials. Optional.'
        fields:
          -
            handle: specs_heading
            field:
              type: text
              display: Heading
              placeholder: Details
              character_limit: 40
          -
            handle: specs
            field:
              type: grid
              display: Details
              mode: table
              add_row: 'Add a line'
              fields:
                -
                  handle: label
                  field:
                    type: text
                    display: Label
                    placeholder: Weight
                    validate:
                      - required
                -
                  handle: value
                  field:
                    type: text
                    display: Value
                    placeholder: '250 g'
                    instructions: 'Leave every value empty for a simple list.'
      -
        display: 'Buy elsewhere'
        instructions: 'Buttons to this product in your Shopee, Lazada or other shop. Optional.'
        fields:
          -
            handle: buy_links
            field:
              type: grid
              display: Shops
              mode: table
              max_rows: 4
              add_row: 'Add a shop'
              fields:
                -
                  handle: label
                  field:
                    type: text
                    display: Label
                    placeholder: 'Buy on Shopee'
                    character_limit: 30
                    validate:
                      - required
                -
                  handle: url
                  field:
                    type: text
                    display: Address
                    input_type: url
                    validate:
                      - required
                      - url
  sidebar:
    display: Sidebar
    sections:
      -
        fields:
          -
            handle: slug
            field:
              type: slug
              display: Slug
              validate:
                - 'max:200'
          -
            handle: price
            field:
              type: float
              display: Price
              instructions: 'Leave empty for "Ask for a price".'
              prepend: RM
          -
            handle: compare_at_price
            field:
              type: float
              display: 'Price before'
              instructions: 'For a sale: the old price, shown crossed out.'
              prepend: RM
          -
            handle: price_note
            field:
              type: text
              display: 'Price note'
              placeholder: 'per box'
              character_limit: 30
          -
            handle: in_stock
            field:
              type: toggle
              display: 'In stock'
              default: true
          -
            handle: featured
            field:
              type: toggle
              display: Featured
              instructions: 'Shown first in Products sections set to Featured, and in the featured rows of the Products page.'
              default: false
          -
            handle: badge
            field:
              type: button_group
              display: Badge
              options:
                new: New
                sale: Sale
                custom: Other
              clearable: true
          -
            handle: badge_text
            field:
              type: text
              display: 'Badge text'
              character_limit: 20
              if:
                badge: 'equals custom'
          -
            handle: sku
            field:
              type: text
              display: SKU
              instructions: 'Your own product code. Optional.'
          -
            handle: product_categories
            field:
              type: terms
              display: Categories
              taxonomies:
                - product_categories
              mode: select
              create: true
  seo:
    display: SEO
    sections:
      -
        fields:
          -
            import: 'marketing-toolkit::seo'
